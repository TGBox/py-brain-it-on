[project]
name = "py-brain-it-out"
version = "0.1.0"
description = "A python game adaptation of Brain it out!"
readme = "README.md"
authors = [
    { name = "Daniel Rösch", email = "droesch91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
py-brain-it-out = "py_brain_it_out:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
